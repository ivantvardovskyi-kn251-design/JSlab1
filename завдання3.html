<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Лабораторна робота 1 — Завдання 3</title>
</head>
<body>
  <h3>Лабораторна робота 1 — Завдання 3</h3>
  <p>Результати виводяться в консоль (F12 → Console)</p>
  <script>
    console.log("Завдання 3. Кусково-задана функція");
    function calcY(x) {
      let y;
      if (x < -2) {
        y = Math.exp(-x) + Math.pow(x, 2);
      } else if (x >= -2 && x < 0) {
        y = Math.log10(Math.abs(x + 1));
      } else if (x >= 0 && x <= 4) {
        y = Math.sqrt(x);
      } else if (x > 4 && x < 10) {
        y = 1 / Math.tan(x);
      } else {
        y = 0;
      }
      return y;
    }
    const xs = [-3, -0.5, 2.25, 5, 12];
    for (const x of xs) {
      console.log("x =", x, ", y =", calcY(x));
    }
  </script>
</body>
</html>
