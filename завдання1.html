<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Лабораторна робота 1 — Завдання 1</title>
</head>
<body>
  <h3>Лабораторна робота 1 — Завдання 1</h3>
  <p>Результати виводяться в консоль (F12 → Console)</p>
  <script>
    console.log("Завдання 1. Логічний вираз: a ≠ b та |a − b| ≥ 1");
    let a = 2, b = 5;
    let result = (a !== b) && (Math.abs(a - b) >= 1);
    console.log("a =", a, ", b =", b);
    console.log("a ≠ b:", a !== b);
    console.log("|a − b| =", Math.abs(a - b));
    console.log("Результат:", result ? "TRUE" : "FALSE");
  </script>
</body>
</html>
