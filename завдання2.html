<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Лабораторна робота 1 — Завдання 2</title>
</head>
<body>
  <h3>Лабораторна робота 1 — Завдання 2</h3>
  <p>Результати виводяться в консоль (F12 → Console)</p>
  <script>
    console.log("Завдання 2. Вираз з проміжними змінними");
    let y = 0.3 * Math.exp(-1);
    let x = Math.log(Math.abs(y - 1)) + Math.cos(y);
    let mu1 = Math.pow(Math.asin(x), 2) + Math.cbrt(Math.abs(x + 2));
    console.log("y =", y);
    console.log("x =", x);
    console.log("μ1 =", mu1);
  </script>
</body>
</html>
